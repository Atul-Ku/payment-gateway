version: '3.8'

services:
  postgres:
    container_name: pg_payment_dev
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    container_name: redis_payment_dev
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data

  kafka:
    container_name: kafka_payment_dev
    ports:
      - '${KAFKA_PORT}:9092'
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui_dev
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KAFKA_UI_PORT}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: payment-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - payment_network

volumes:
  pg_data:
  redis_data:
  kafka_data: